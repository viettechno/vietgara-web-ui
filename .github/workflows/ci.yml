name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test and build the gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prettier --check src dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:gallery
